// BLACKSITE house autoexec for Nexuiz Classic 2.5.2.
//
// Config only — the way real Nexuiz servers were run. No gamecode is
// touched: these are the game's own cvars, set at startup. The
// flagship is MinstaHook instagib, the "thisissparta" flavor:
// MinstaGib (the one-shot MinstaNex) plus the grappling hook. They
// rule every game this client hosts locally; online, the server's
// own settings rule, as they always did.
//
// The full data pack also carries the game's own configs
// (defaultNexuiz.cfg, balance25.cfg, newhook.cfg); this file only
// sets the house's table.

// ——— platform ———
// Use SDL's millisecond timer. Under Emscripten the engine's
// default clock source reports a broken frame time (console shows
// steps to 4294967297.0 s and the delta collapses — the menu's
// frametime fade never advances and the world clock stalls).
// sys_usesdlgetticks is the engine's own switch for its
// SDL_GetTicks() timer, which is monotonic in the browser.
sys_usesdlgetticks 1
// The GLES2 renderpath cannot stretch-upload a 3D texture, and
// the engine faults (R_UploadFullTexture "lightgrid") when a
// Q3 BSP's lightgrid is uploaded as a global texture. The
// engine's own cvar keeps the lightgrid data — entities are
// still lit from the grid at their origin — without the global
// texture upload.
mod_q3bsp_lightgrid_texture 0

// ——— performance ———
// The game's own default table, dealt whole. In the release's
// Effects settings (menu source:
// qcsrc/menu/nexuiz/dialog_settings_effects.c) the "Normal"
// quality-preset button runs exactly this exec, and it is what
// the release itself starts with (defaultNexuiz.cfg). The house
// briefly dealt the "Low" preset instead, chasing frame rate;
// measurement acquitted it — on the test rig every lightening
// lever (the Low table included) moved frame rate not at all,
// and the operator's own machine reported the graphics fine
// while the network path starved. So the game ships as its
// makers shipped it: full effects, nothing invented, nothing
// held back. (The developer-only "OMG!" preset is not dealt:
// it carries debug values — picmip 1337, showsurfaces 3 — not
// a player table.)
exec effects-normal.cfg

// ——— MinstaHook ———
g_minstagib 1
g_grappling_hook 1
g_powerups 0
g_use_ammunition 1
g_minstagib_ammo_start 12
g_balance_minstanex_refire 0.8
g_forced_respawn 1
g_respawn_delay 0.8
g_warmup 0

// ——— table manners ———
fraglimit_override 30
timelimit_override 20

// ——— connection ———
// The client's download rate in bytes per second — the pace the
// engine asks the server to feed it at. The engine default is
// 20000, about 52 seconds a megabyte, which made a map download
// a multi-minute transfer inside the server's silence budget;
// the 2026-10-25 public proof lost a player to exactly that.
// The house rate is 100000 — five times the default, still ten
// times under this room's own server cap.
rate 100000
